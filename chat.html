<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Чат</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--panel:#21253a;--border:#2e334d;
  --accent:#6c8cff;--accent2:#a78bfa;--text:#e8eaf6;--muted:#7b82a8;
  --me-bg:linear-gradient(135deg,#6c8cff,#a78bfa);--them-bg:#2a2f47;--radius:18px;
}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* ── AUTH ── */
.auth-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:20px;background:radial-gradient(ellipse 80% 60% at 50% 40%,#1a1f3a 0%,var(--bg) 70%)}
.auth-logo{width:72px;height:72px;background:var(--me-bg);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 8px 32px rgba(108,140,255,.35)}
.auth-title{font-size:1.6rem;font-weight:600;letter-spacing:-.02em;text-align:center}
.auth-tabs{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px;width:100%;max-width:340px}
.auth-tab{flex:1;padding:8px;border:none;background:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:.85rem;font-weight:500;border-radius:9px;cursor:pointer;transition:all .2s}
.auth-tab.active{background:var(--panel);color:var(--text)}
.auth-form{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.auth-form input{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;font-size:.95rem;font-family:'Inter',sans-serif;color:var(--text);outline:none;transition:border-color .2s}
.auth-form input::placeholder{color:var(--muted)}
.auth-form input:focus{border-color:var(--accent)}
.btn-primary{background:var(--me-bg);color:#fff;border:none;border-radius:12px;padding:13px;font-size:.95rem;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s,transform .15s;margin-top:4px}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.auth-error{font-size:.8rem;color:#f87171;text-align:center;min-height:18px}

/* ── CHAT ── */
#chat-screen{display:none;flex-direction:column;height:100dvh}
.chat-header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:10}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.9rem;flex-shrink:0}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-header-status{font-size:.72rem;color:#4ade80;display:flex;align-items:center;gap:4px}
.dot-online{width:6px;height:6px;background:#4ade80;border-radius:50%;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hdr-btns{display:flex;gap:8px}
.hdr-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:.75rem;font-family:'Inter',sans-serif;cursor:pointer;transition:color .2s,border-color .2s}
.hdr-btn:hover{color:var(--text);border-color:var(--accent)}
.hdr-btn.danger:hover{color:#f87171;border-color:#f87171}

.chat-body{display:flex;flex:1;overflow:hidden}
.chat-main{display:flex;flex-direction:column;flex:1;overflow:hidden}

#messages{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
#messages::-webkit-scrollbar{width:4px}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.date-div{text-align:center;font-size:.7rem;color:var(--muted);margin:8px 0 4px;letter-spacing:.05em}
.msg-row{display:flex;align-items:flex-end;gap:8px;animation:msgIn .25s ease both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-row.me{flex-direction:row-reverse}
.msg-row.me .msg-av{display:none}
.msg-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;flex-shrink:0}
.msg-bubble{max-width:min(72%,360px);padding:10px 14px;border-radius:var(--radius);font-size:.9rem;line-height:1.45;word-break:break-word}
.msg-row.me .msg-bubble{background:var(--me-bg);color:#fff;border-bottom-right-radius:5px}
.msg-row.them .msg-bubble{background:var(--them-bg);color:var(--text);border-bottom-left-radius:5px}
.msg-name{font-size:.7rem;font-weight:600;color:var(--accent2);margin-bottom:3px}
.msg-time{font-size:.65rem;color:rgba(255,255,255,.4);margin-top:3px;text-align:right}
.msg-row.them .msg-time{color:var(--muted);text-align:left}

/* photo message */
.msg-photo{max-width:220px;border-radius:12px;display:block;cursor:pointer}

/* voice message */
.voice-msg{display:flex;align-items:center;gap:10px;min-width:160px}
.voice-play{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1rem}
.msg-row.them .voice-play{background:var(--accent)}
.voice-wave{flex:1;height:28px;display:flex;align-items:center;gap:2px}
.voice-wave span{display:inline-block;width:3px;border-radius:2px;background:rgba(255,255,255,.5);animation:wave 1.2s ease-in-out infinite}
.msg-row.them .voice-wave span{background:var(--accent)}
.voice-wave span:nth-child(1){height:8px;animation-delay:0s}
.voice-wave span:nth-child(2){height:16px;animation-delay:.1s}
.voice-wave span:nth-child(3){height:22px;animation-delay:.2s}
.voice-wave span:nth-child(4){height:14px;animation-delay:.3s}
.voice-wave span:nth-child(5){height:20px;animation-delay:.4s}
.voice-wave span:nth-child(6){height:10px;animation-delay:.5s}
.voice-wave span:nth-child(7){height:18px;animation-delay:.15s}
@keyframes wave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}
.voice-dur{font-size:.72rem;color:rgba(255,255,255,.6)}
.msg-row.them .voice-dur{color:var(--muted)}

#typing-ind{padding:0 16px 6px;font-size:.75rem;color:var(--muted);min-height:20px;flex-shrink:0}

/* input area */
.input-area{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 14px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.input-btns{display:flex;gap:6px;flex-shrink:0}
.input-btn{width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--border);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:all .2s;flex-shrink:0}
.input-btn:hover{color:var(--text);border-color:var(--accent)}
.input-btn.recording{background:#f87171;border-color:#f87171;color:#fff;animation:recPulse 1s ease-in-out infinite}
@keyframes recPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#msg-input{flex:1;background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:11px 14px;font-size:.9rem;font-family:'Inter',sans-serif;color:var(--text);resize:none;outline:none;max-height:120px;line-height:1.4;transition:border-color .2s}
#msg-input::placeholder{color:var(--muted)}
#msg-input:focus{border-color:var(--accent)}
.btn-send{width:44px;height:44px;background:var(--me-bg);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s}
.btn-send:hover{transform:scale(1.08)}
.btn-send svg{width:20px;height:20px;fill:#fff}

/* online panel */
#online-panel{width:180px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.online-title{padding:14px 14px 8px;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
.online-list{padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.online-user{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:9px}
.online-user .av-sm{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:600;flex-shrink:0}
.online-uname{font-size:.8rem;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.online-me{font-size:.65rem;color:var(--muted)}
.odot{width:7px;height:7px;background:#4ade80;border-radius:50%;flex-shrink:0;animation:pulse 2s ease-in-out infinite}

/* bg picker modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:440px;max-height:80vh;overflow-y:auto}
.modal h3{font-size:1rem;font-weight:600;margin-bottom:16px}
.bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bg-opt{height:70px;border-radius:12px;cursor:pointer;border:2px solid transparent;transition:border-color .2s,transform .15s;overflow:hidden}
.bg-opt:hover{transform:scale(1.04)}
.bg-opt.active{border-color:var(--accent)}
.bg-opt span{display:block;width:100%;height:100%}
.modal-close{margin-top:16px;width:100%;padding:10px;background:var(--panel);color:var(--muted);border:1px solid var(--border);border-radius:10px;font-family:'Inter',sans-serif;font-size:.88rem;cursor:pointer}

/* image viewer */
.img-viewer{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer}
.img-viewer img{max-width:95vw;max-height:90vh;border-radius:12px}

/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--deep,#2c3e36);color:#fff;padding:9px 20px;border-radius:30px;font-size:.82rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:300;background:var(--surface);border:1px solid var(--border)}
#toast.show{opacity:1}

@media(max-width:500px){#online-panel{width:120px}.online-uname{font-size:.72rem}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-logo">💬</div>
  <div class="auth-title">Войти в чат</div>
  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchTab('login')">Войти</button>
    <button class="auth-tab" onclick="switchTab('register')">Регистрация</button>
  </div>
  <div class="auth-form">
    <input id="inp-name" type="text" placeholder="Имя пользователя" maxlength="24" autocomplete="off"/>
    <input id="inp-pass" type="password" placeholder="Пароль" maxlength="32"/>
    <div id="inp-pass2-wrap" style="display:none">
      <input id="inp-pass2" type="password" placeholder="Повторите пароль" maxlength="32" style="width:100%"/>
    </div>
    <input id="inp-room" type="text" placeholder="Название комнаты" maxlength="32" autocomplete="off"/>
    <div class="auth-error" id="auth-err"></div>
    <button class="btn-primary" id="auth-btn" onclick="doAuth()">Войти →</button>
  </div>
</div>

<!-- CHAT -->
<div id="chat-screen">
  <div class="chat-header">
    <div class="avatar" id="hdr-av">?</div>
    <div class="chat-header-info">
      <div class="chat-header-name" id="hdr-room">Комната</div>
      <div class="chat-header-status"><div class="dot-online"></div><span id="hdr-status">онлайн</span></div>
    </div>
    <div class="hdr-btns">
      <button class="hdr-btn" onclick="openBgPicker()">🎨 Фон</button>
      <button class="hdr-btn danger" onclick="leaveChat()">Выйти</button>
    </div>
  </div>

  <div class="chat-body">
    <div class="chat-main">
      <div id="messages"></div>
      <div id="typing-ind"></div>
      <div class="input-area">
        <div class="input-btns">
          <button class="input-btn" id="voice-btn" title="Голосовое" onclick="toggleVoice()">🎤</button>
          <button class="input-btn" title="Фото" onclick="document.getElementById('photo-inp').click()">📷</button>
          <input type="file" id="photo-inp" accept="image/*" style="display:none" onchange="sendPhoto(this)"/>
        </div>
        <textarea id="msg-input" rows="1" placeholder="Сообщение..."></textarea>
        <button class="btn-send" onclick="sendMsg()">
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>

    <div id="online-panel">
      <div class="online-title">👥 Онлайн <span id="online-count"></span></div>
      <div class="online-list" id="online-list"></div>
    </div>
  </div>
</div>

<!-- BG PICKER -->
<div class="modal-overlay" id="bg-modal" style="display:none" onclick="closeBgModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>🎨 Фон чата</h3>
    <div class="bg-grid" id="bg-grid"></div>
    <button class="modal-close" onclick="closeBgModal()">Закрыть</button>
  </div>
</div>

<!-- IMAGE VIEWER -->
<div class="img-viewer" id="img-viewer" style="display:none" onclick="this.style.display='none'">
  <img id="img-view-src" src="" alt=""/>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, serverTimestamp, set, onDisconnect, remove, get }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FC = {
  apiKey:"AIzaSyAOJruioW78739DlsOU9jT-ryiHNjWmSYE",
  authDomain:"chat-8d585.firebaseapp.com",
  databaseURL:"https://chat-8d585-default-rtdb.firebaseio.com",
  projectId:"chat-8d585",
  storageBucket:"chat-8d585.firebasestorage.app",
  messagingSenderId:"32516069802",
  appId:"1:32516069802:web:d113054256d6370da933d3"
};
const app = initializeApp(FC);
const db  = getDatabase(app);

// ── state ──
let myName='', roomId='', typingRef=null, typingTO=null, lastDate='';
let mediaRec=null, isRecording=false, recChunks=[], recStart=0;
let authMode='login';

// ── backgrounds ──
const BACKGROUNDS = [
  {label:'Тёмный',style:'#0f1117'},
  {label:'Ночное небо',style:'linear-gradient(135deg,#0f0c29,#302b63,#24243e)'},
  {label:'Закат',style:'linear-gradient(135deg,#f093fb,#f5576c)'},
  {label:'Океан',style:'linear-gradient(135deg,#0575e6,#021b79)'},
  {label:'Лес',style:'linear-gradient(135deg,#134e5e,#71b280)'},
  {label:'Аврора',style:'linear-gradient(135deg,#00c9ff,#92fe9d)'},
  {label:'Пустыня',style:'linear-gradient(135deg,#f7971e,#ffd200)'},
  {label:'Космос',style:'radial-gradient(ellipse at top,#1b2735 0%,#090a0f 100%)'},
  {label:'Розовый',style:'linear-gradient(135deg,#fbc2eb,#a18cd1)'},
];

// build bg grid
const bgGrid = document.getElementById('bg-grid');
BACKGROUNDS.forEach((bg,i) => {
  const d = document.createElement('div');
  d.className = 'bg-opt' + (i===0?' active':'');
  d.title = bg.label;
  d.dataset.idx = i;
  const s = document.createElement('span');
  s.style.background = bg.style;
  d.appendChild(s);
  d.onclick = () => {
    document.querySelectorAll('.bg-opt').forEach(x=>x.classList.remove('active'));
    d.classList.add('active');
    document.getElementById('messages').style.background = bg.style;
    localStorage.setItem('chatBg', i);
  };
  bgGrid.appendChild(d);
});

function loadBg() {
  const i = parseInt(localStorage.getItem('chatBg')||'0');
  if(BACKGROUNDS[i]) {
    document.getElementById('messages').style.background = BACKGROUNDS[i].style;
    document.querySelectorAll('.bg-opt').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.bg-opt')[i]?.classList.add('active');
  }
}

window.openBgPicker = () => { document.getElementById('bg-modal').style.display='flex'; };
window.closeBgModal = (e) => {
  if(!e || e.target===document.getElementById('bg-modal'))
    document.getElementById('bg-modal').style.display='none';
};

// ── auth tabs ──
window.switchTab = function(mode) {
  authMode = mode;
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',i===(mode==='login'?0:1)));
  document.getElementById('inp-pass2-wrap').style.display = mode==='register'?'block':'none';
  document.getElementById('auth-btn').textContent = mode==='register'?'Зарегистрироваться →':'Войти →';
  document.getElementById('auth-err').textContent = '';
};

// ── auth ──
window.doAuth = async function() {
  const name = document.getElementById('inp-name').value.trim();
  const pass = document.getElementById('inp-pass').value;
  const room = document.getElementById('inp-room').value.trim();
  const errEl = document.getElementById('auth-err');
  errEl.textContent = '';

  if(!name){errEl.textContent='Введи имя';return;}
  if(pass.length<3){errEl.textContent='Пароль минимум 3 символа';return;}
  if(!room){errEl.textContent='Введи название комнаты';return;}

  const safeRoom = room.toLowerCase().replace(/[^a-zа-яё0-9]/gi,'_');
  const userRef = ref(db,`users/${name}`);

  try {
    const snap = await get(userRef);
    if(authMode==='register') {
      if(snap.exists()){errEl.textContent='Имя уже занято';return;}
      await set(userRef,{pass,created:Date.now()});
      toast('Аккаунт создан!');
    } else {
      if(!snap.exists()){errEl.textContent='Пользователь не найден';return;}
      if(snap.val().pass!==pass){errEl.textContent='Неверный пароль';return;}
    }
    startChat(name, safeRoom, room);
  } catch(e) {
    errEl.textContent = 'Ошибка подключения. Проверь Firebase Rules.';
  }
};

function startChat(name, safeRoom, displayRoom) {
  myName = name; roomId = safeRoom;
  document.getElementById('auth-screen').style.display='none';
  const cs = document.getElementById('chat-screen');
  cs.style.display='flex';
  document.getElementById('hdr-room').textContent = '# '+displayRoom;
  const av = document.getElementById('hdr-av');
  av.textContent = initials(name);
  av.style.background = nameColor(name);
  loadBg();

  // messages
  onValue(ref(db,`rooms/${roomId}/messages`), snap => renderMessages(snap.val()));

  // typing
  onValue(ref(db,`rooms/${roomId}/typing`), snap => {
    const d = snap.val()||{};
    const others = Object.entries(d).filter(([k,v])=>k!==myName&&v).map(([k])=>k);
    document.getElementById('typing-ind').textContent = others.length?`${others.join(', ')} печатает...`:'';
  });

  // online
  typingRef = ref(db,`rooms/${roomId}/typing/${myName}`);
  onDisconnect(typingRef).remove();
  const onRef = ref(db,`rooms/${roomId}/online/${myName}`);
  set(onRef,{name:myName,ts:Date.now()});
  onDisconnect(onRef).remove();
  onValue(ref(db,`rooms/${roomId}/online`), snap => renderOnline(snap.val()||{}));
}

window.leaveChat = function() {
  if(typingRef) remove(typingRef);
  remove(ref(db,`rooms/${roomId}/online/${myName}`));
  document.getElementById('chat-screen').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('messages').innerHTML='';
  lastDate='';
};

// ── send text ──
window.sendMsg = function() {
  const inp = document.getElementById('msg-input');
  const text = inp.value.trim();
  if(!text) return;
  push(ref(db,`rooms/${roomId}/messages`),{type:'text',name:myName,text,ts:serverTimestamp()});
  inp.value=''; inp.style.height='auto';
  if(typingRef) set(typingRef,false);
  clearTimeout(typingTO);
};

// ── send photo ──
window.sendPhoto = function(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    push(ref(db,`rooms/${roomId}/messages`),{type:'photo',name:myName,data:e.target.result,ts:serverTimestamp()});
    toast('Фото отправлено');
  };
  reader.readAsDataURL(file);
  input.value='';
};

// ── voice recording ──
window.toggleVoice = async function() {
  const btn = document.getElementById('voice-btn');
  if(!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRec = new MediaRecorder(stream);
      recChunks = [];
      recStart = Date.now();
      mediaRec.ondataavailable = e => recChunks.push(e.data);
      mediaRec.onstop = () => {
        const blob = new Blob(recChunks,{type:'audio/webm'});
        const dur = Math.round((Date.now()-recStart)/1000);
        const reader = new FileReader();
        reader.onload = e => {
          push(ref(db,`rooms/${roomId}/messages`),{type:'voice',name:myName,data:e.target.result,dur,ts:serverTimestamp()});
          toast('Голосовое отправлено');
        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(t=>t.stop());
      };
      mediaRec.start();
      isRecording=true;
      btn.classList.add('recording');
      btn.title='Остановить запись';
    } catch(e) {
      toast('Нет доступа к микрофону');
    }
  } else {
    mediaRec.stop();
    isRecording=false;
    btn.classList.remove('recording');
    btn.title='Голосовое';
  }
};

// ── play voice ──
window.playVoice = function(btn, data) {
  const audio = new Audio(data);
  audio.play();
  btn.textContent='⏸';
  audio.onended = () => btn.textContent='▶';
};

// ── view photo ──
window.viewPhoto = function(src) {
  document.getElementById('img-view-src').src=src;
  document.getElementById('img-viewer').style.display='flex';
};

// ── render ──
function renderMessages(msgs) {
  const c = document.getElementById('messages');
  const atBot = c.scrollHeight-c.scrollTop-c.clientHeight < 80;
  c.innerHTML=''; lastDate='';
  if(!msgs){
    c.innerHTML='<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem;text-align:center;padding:40px"><span style="font-size:2.5rem;margin-bottom:12px">👋</span>Пока нет сообщений</div>';
    return;
  }
  Object.values(msgs).forEach(msg=>{
    const ds = fmtDate(msg.ts);
    if(ds&&ds!==lastDate){
      const d=document.createElement('div');d.className='date-div';d.textContent=ds;c.appendChild(d);lastDate=ds;
    }
    const isMe=msg.name===myName;
    const row=document.createElement('div');
    row.className=`msg-row ${isMe?'me':'them'}`;
    if(!isMe){const av=document.createElement('div');av.className='msg-av';av.textContent=initials(msg.name);av.style.background=nameColor(msg.name);row.appendChild(av);}
    const bub=document.createElement('div');bub.className='msg-bubble';
    if(!isMe){const nm=document.createElement('div');nm.className='msg-name';nm.textContent=msg.name;bub.appendChild(nm);}
    if(msg.type==='text'||!msg.type){
      const t=document.createElement('div');t.textContent=msg.text;bub.appendChild(t);
    } else if(msg.type==='photo'){
      const img=document.createElement('img');img.className='msg-photo';img.src=msg.data;img.onclick=()=>viewPhoto(msg.data);bub.appendChild(img);
    } else if(msg.type==='voice'){
      const vw=document.createElement('div');vw.className='voice-msg';
      const pb=document.createElement('button');pb.className='voice-play';pb.textContent='▶';pb.onclick=()=>playVoice(pb,msg.data);
      const wv=document.createElement('div');wv.className='voice-wave';
      for(let i=0;i<7;i++){const s=document.createElement('span');wv.appendChild(s);}
      const dr=document.createElement('span');dr.className='voice-dur';dr.textContent=(msg.dur||0)+'с';
      vw.appendChild(pb);vw.appendChild(wv);vw.appendChild(dr);bub.appendChild(vw);
    }
    const tm=document.createElement('div');tm.className='msg-time';tm.textContent=fmtTime(msg.ts);bub.appendChild(tm);
    row.appendChild(bub);c.appendChild(row);
  });
  if(atBot) c.scrollTop=c.scrollHeight;
}

function renderOnline(data) {
  const list=document.getElementById('online-list');
  const cnt=document.getElementById('online-count');
  const entries=Object.values(data).sort((a,b)=>a.name===myName?-1:b.name===myName?1:0);
  cnt.textContent='· '+entries.length;
  list.innerHTML='';
  entries.forEach(u=>{
    const div=document.createElement('div');div.className='online-user';
    const av=document.createElement('div');av.className='av-sm';av.textContent=initials(u.name);av.style.background=nameColor(u.name);
    const nw=document.createElement('div');nw.style.overflow='hidden';nw.style.flex='1';
    const nm=document.createElement('div');nm.className='online-uname';nm.textContent=u.name;nw.appendChild(nm);
    if(u.name===myName){const me=document.createElement('div');me.className='online-me';me.textContent='ты';nw.appendChild(me);}
    const dot=document.createElement('div');dot.className='odot';
    div.appendChild(av);div.appendChild(nw);div.appendChild(dot);list.appendChild(div);
  });
}

// ── utils ──
function nameColor(n){const c=['#6c8cff','#a78bfa','#34d399','#f472b6','#fb923c','#60a5fa'];let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))&0xffffffff;return c[Math.abs(h)%c.length];}
function initials(n){return n.trim().slice(0,2).toUpperCase();}
function fmtTime(ts){if(!ts)return'';return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(ts){if(!ts)return'';const d=new Date(ts),t=new Date();if(d.toDateString()===t.toDateString())return'Сегодня';const y=new Date(t);y.setDate(t.getDate()-1);if(d.toDateString()===y.toDateString())return'Вчера';return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});}

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}
window.toast=toast;

// textarea auto-resize + enter
const inp=document.getElementById('msg-input');
inp.addEventListener('input',()=>{
  inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';
  if(typingRef){set(typingRef,true);clearTimeout(typingTO);typingTO=setTimeout(()=>set(typingRef,false),2500);}
});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();window.sendMsg();}});
</script>
