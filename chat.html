<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Чат</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--panel:#21253a;--border:#2e334d;
  --accent:#6c8cff;--accent2:#a78bfa;--text:#e8eaf6;--muted:#7b82a8;
  --me-bg:linear-gradient(135deg,#6c8cff,#a78bfa);--them-bg:#2a2f47;--radius:18px;
}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* AUTH */
.auth-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:18px;background:radial-gradient(ellipse 80% 60% at 50% 40%,#1a1f3a 0%,var(--bg) 70%)}
.auth-logo{width:72px;height:72px;background:var(--me-bg);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 8px 32px rgba(108,140,255,.35)}
.auth-title{font-size:1.6rem;font-weight:600;letter-spacing:-.02em;text-align:center}
.auth-tabs{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px;width:100%;max-width:340px}
.auth-tab{flex:1;padding:8px;border:none;background:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:.85rem;font-weight:500;border-radius:9px;cursor:pointer;transition:all .2s}
.auth-tab.active{background:var(--panel);color:var(--text)}
.auth-form{display:flex;flex-direction:column;gap:11px;width:100%;max-width:340px}
.auth-form input{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 16px;font-size:.95rem;font-family:'Inter',sans-serif;color:var(--text);outline:none;transition:border-color .2s;width:100%}
.auth-form input::placeholder{color:var(--muted)}
.auth-form input:focus{border-color:var(--accent)}

/* avatar picker in auth */
.avatar-pick-row{display:flex;align-items:center;gap:12px}
.avatar-preview{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:600;flex-shrink:0;cursor:pointer;border:2px dashed var(--border);transition:border-color .2s;overflow:hidden;background:var(--surface)}
.avatar-preview:hover{border-color:var(--accent)}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
.avatar-pick-hint{font-size:.78rem;color:var(--muted);line-height:1.4}

.btn-primary{background:var(--me-bg);color:#fff;border:none;border-radius:12px;padding:13px;font-size:.95rem;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s,transform .15s;margin-top:4px}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.auth-error{font-size:.8rem;color:#f87171;text-align:center;min-height:16px}

/* CHAT */
#chat-screen{display:none;flex-direction:column;height:100dvh}
.chat-header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.hdr-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.9rem;flex-shrink:0;overflow:hidden}
.hdr-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-header-status{font-size:.72rem;color:#4ade80;display:flex;align-items:center;gap:4px}
.dot-online{width:6px;height:6px;background:#4ade80;border-radius:50%;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hdr-btns{display:flex;gap:6px}
.hdr-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:.75rem;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s}
.hdr-btn:hover{color:var(--text);border-color:var(--accent)}
.hdr-btn.danger:hover{color:#f87171;border-color:#f87171}

.chat-body{display:flex;flex:1;overflow:hidden}
.chat-main{display:flex;flex-direction:column;flex:1;overflow:hidden}

#messages{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth}
#messages::-webkit-scrollbar{width:4px}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.date-div{text-align:center;font-size:.7rem;color:var(--muted);margin:8px 0 4px;letter-spacing:.05em}

/* message row */
.msg-row{display:flex;align-items:flex-end;gap:8px;animation:msgIn .22s ease both;position:relative}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-row.me{flex-direction:row-reverse}
.msg-row.me .msg-av{display:none}
.msg-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;flex-shrink:0;overflow:hidden}
.msg-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}

.msg-wrap{display:flex;flex-direction:column;max-width:min(72%,360px)}
.msg-row.me .msg-wrap{align-items:flex-end}

/* reply preview inside bubble */
.reply-preview{background:rgba(255,255,255,.12);border-left:3px solid var(--accent2);border-radius:8px;padding:5px 8px;margin-bottom:6px;font-size:.75rem;cursor:pointer}
.reply-preview-name{color:var(--accent2);font-weight:600;margin-bottom:1px}
.reply-preview-text{color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-row.them .reply-preview{background:rgba(255,255,255,.08)}
.msg-row.them .reply-preview-text{color:var(--muted)}

.msg-bubble{padding:9px 13px;border-radius:var(--radius);font-size:.9rem;line-height:1.45;word-break:break-word;position:relative}
.msg-row.me .msg-bubble{background:var(--me-bg);color:#fff;border-bottom-right-radius:5px}
.msg-row.them .msg-bubble{background:var(--them-bg);color:var(--text);border-bottom-left-radius:5px}
.msg-name{font-size:.7rem;font-weight:600;color:var(--accent2);margin-bottom:3px}
.msg-time{font-size:.62rem;color:rgba(255,255,255,.4);margin-top:3px;text-align:right}
.msg-row.them .msg-time{color:var(--muted);text-align:left}
.msg-photo{max-width:220px;border-radius:10px;display:block;cursor:pointer;margin-bottom:2px}

/* voice */
.voice-msg{display:flex;align-items:center;gap:9px;min-width:150px}
.voice-play{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.9rem}
.msg-row.them .voice-play{background:var(--accent)}
.voice-wave{flex:1;height:24px;display:flex;align-items:center;gap:2px}
.voice-wave span{display:inline-block;width:3px;border-radius:2px;background:rgba(255,255,255,.5);animation:wave 1.2s ease-in-out infinite}
.msg-row.them .voice-wave span{background:var(--accent)}
.voice-wave span:nth-child(1){height:7px}.voice-wave span:nth-child(2){height:14px;animation-delay:.1s}.voice-wave span:nth-child(3){height:20px;animation-delay:.2s}.voice-wave span:nth-child(4){height:12px;animation-delay:.3s}.voice-wave span:nth-child(5){height:18px;animation-delay:.4s}.voice-wave span:nth-child(6){height:9px;animation-delay:.5s}.voice-wave span:nth-child(7){height:16px;animation-delay:.15s}
@keyframes wave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}
.voice-dur{font-size:.7rem;color:rgba(255,255,255,.6)}
.msg-row.them .voice-dur{color:var(--muted)}

/* reactions */
.msg-reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.reaction-chip{display:flex;align-items:center;gap:3px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:2px 7px;font-size:.8rem;cursor:pointer;transition:all .15s;user-select:none}
.reaction-chip:hover{border-color:var(--accent)}
.reaction-chip.mine{background:rgba(108,140,255,.2);border-color:var(--accent)}
.reaction-chip .r-count{font-size:.72rem;color:var(--muted)}

/* reaction picker */
.reaction-picker{position:absolute;bottom:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 10px;display:flex;gap:6px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:popIn .15s ease}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.msg-row.me .reaction-picker{right:0}
.msg-row.them .reaction-picker{left:36px}
.reaction-picker button{background:none;border:none;font-size:1.3rem;cursor:pointer;border-radius:8px;padding:3px 5px;transition:transform .1s}
.reaction-picker button:hover{transform:scale(1.3)}

/* reply bar */
#reply-bar{display:none;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-top:1px solid var(--border);flex-shrink:0}
.reply-bar-content{flex:1;min-width:0}
.reply-bar-name{font-size:.75rem;font-weight:600;color:var(--accent2)}
.reply-bar-text{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply-bar-close{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:0 4px;flex-shrink:0}
.reply-bar-close:hover{color:var(--text)}

#typing-ind{padding:0 16px 4px;font-size:.75rem;color:var(--muted);min-height:18px;flex-shrink:0}

/* input */
.input-area{display:flex;align-items:flex-end;gap:7px;padding:10px 12px 14px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.input-btns{display:flex;gap:5px;flex-shrink:0}
.input-btn{width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--border);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.05rem;transition:all .2s}
.input-btn:hover{color:var(--text);border-color:var(--accent)}
.input-btn.recording{background:#f87171;border-color:#f87171;color:#fff;animation:recPulse 1s ease-in-out infinite}
@keyframes recPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#msg-input{flex:1;background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:10px 14px;font-size:.9rem;font-family:'Inter',sans-serif;color:var(--text);resize:none;outline:none;max-height:120px;line-height:1.4;transition:border-color .2s}
#msg-input::placeholder{color:var(--muted)}
#msg-input:focus{border-color:var(--accent)}
.btn-send{width:42px;height:42px;background:var(--me-bg);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s}
.btn-send:hover{transform:scale(1.08)}
.btn-send svg{width:19px;height:19px;fill:#fff}

/* online panel */
#online-panel{width:170px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.online-title{padding:12px 12px 7px;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
.online-list{padding:7px 8px;display:flex;flex-direction:column;gap:3px}
.online-user{display:flex;align-items:center;gap:7px;padding:5px 5px;border-radius:9px}
.online-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:600;flex-shrink:0;overflow:hidden}
.online-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.online-uname{font-size:.78rem;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.online-me-tag{font-size:.62rem;color:var(--muted)}
.odot{width:6px;height:6px;background:#4ade80;border-radius:50%;flex-shrink:0;animation:pulse 2s ease-in-out infinite}

/* modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;width:100%;max-width:420px;max-height:82vh;overflow-y:auto}
.modal h3{font-size:1rem;font-weight:600;margin-bottom:14px}
.bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.bg-opt{height:66px;border-radius:11px;cursor:pointer;border:2px solid transparent;transition:all .2s;overflow:hidden}
.bg-opt:hover{transform:scale(1.04)}
.bg-opt.active{border-color:var(--accent)}
.bg-opt span{display:block;width:100%;height:100%}
.bg-upload-btn{width:100%;padding:10px;background:var(--panel);color:var(--text);border:1.5px dashed var(--border);border-radius:11px;font-family:'Inter',sans-serif;font-size:.85rem;cursor:pointer;margin-bottom:10px;transition:border-color .2s}
.bg-upload-btn:hover{border-color:var(--accent)}
.modal-close{width:100%;padding:9px;background:var(--panel);color:var(--muted);border:1px solid var(--border);border-radius:10px;font-family:'Inter',sans-serif;font-size:.85rem;cursor:pointer}

/* avatar editor modal */
.av-editor{display:flex;flex-direction:column;align-items:center;gap:14px}
.av-big{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:600;overflow:hidden;cursor:pointer;border:3px dashed var(--border);transition:border-color .2s}
.av-big:hover{border-color:var(--accent)}
.av-big img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av-hint{font-size:.8rem;color:var(--muted);text-align:center}
.av-colors{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.av-color{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.av-color:hover,.av-color.selected{border-color:#fff;transform:scale(1.15)}

/* image viewer */
.img-viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:flex;align-items:center;justify-content:center;cursor:pointer}
.img-viewer img{max-width:95vw;max-height:90vh;border-radius:12px}

/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);border:1px solid var(--border);padding:9px 20px;border-radius:30px;font-size:.82rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:300;white-space:nowrap}
#toast.show{opacity:1}

/* message action buttons */
.msg-action-btn{width:28px;height:28px;border-radius:50%;background:var(--panel);border:1px solid var(--border);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:all .15s;padding:0;line-height:1}
.msg-action-btn:hover{color:var(--text);border-color:var(--accent);transform:scale(1.1)}
.msg-action-btn.del:hover{color:#f87171;border-color:#f87171}

/* context menu (long press / right click) */
.ctx-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;z-index:80;box-shadow:0 8px 28px rgba(0,0,0,.5);animation:popIn .15s ease;min-width:150px}
.ctx-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:8px;font-size:.85rem;cursor:pointer;transition:background .15s}
.ctx-item:hover{background:var(--panel)}
.ctx-item.danger{color:#f87171}

@media(max-width:500px){#online-panel{width:110px}.online-uname{font-size:.7rem}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-logo">💬</div>
  <div class="auth-title">Войти в чат</div>
  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchTab('login')">Войти</button>
    <button class="auth-tab" onclick="switchTab('register')">Регистрация</button>
  </div>
  <div class="auth-form">
    <div id="av-pick-row" class="avatar-pick-row" style="display:none">
      <div class="avatar-preview" id="auth-av-preview" onclick="document.getElementById('auth-av-inp').click()">
        <span id="auth-av-emoji">📷</span>
      </div>
      <div class="avatar-pick-hint">Нажми чтобы выбрать<br>фото профиля</div>
      <input type="file" id="auth-av-inp" accept="image/*" style="display:none" onchange="previewAuthAvatar(this)"/>
    </div>
    <input id="inp-name" type="text" placeholder="Имя пользователя" maxlength="24" autocomplete="off"/>
    <input id="inp-pass" type="password" placeholder="Пароль" maxlength="32"/>
    <div id="inp-pass2-wrap" style="display:none">
      <input id="inp-pass2" type="password" placeholder="Повторите пароль" maxlength="32" style="width:100%"/>
    </div>
    <input id="inp-room" type="text" placeholder="Название комнаты" maxlength="32" autocomplete="off"/>
    <div class="auth-error" id="auth-err"></div>
    <button class="btn-primary" id="auth-btn" onclick="doAuth()">Войти →</button>
  </div>
</div>

<!-- CHAT -->
<div id="chat-screen">
  <div class="chat-header">
    <div class="hdr-avatar" id="hdr-av"><span id="hdr-av-text">?</span></div>
    <div class="chat-header-info">
      <div class="chat-header-name" id="hdr-room">Комната</div>
      <div class="chat-header-status"><div class="dot-online"></div>онлайн</div>
    </div>
    <div class="hdr-btns">
      <button class="hdr-btn" onclick="openBgPicker()">🎨</button>
      <button class="hdr-btn" onclick="openAvEditor()">👤</button>
      <button class="hdr-btn danger" onclick="leaveChat()">Выйти</button>
    </div>
  </div>

  <div class="chat-body">
    <div class="chat-main">
      <div id="messages"></div>
      <div id="typing-ind"></div>
      <div id="reply-bar">
        <div class="reply-bar-content">
          <div class="reply-bar-name" id="rb-name"></div>
          <div class="reply-bar-text" id="rb-text"></div>
        </div>
        <button class="reply-bar-close" onclick="cancelReply()">✕</button>
      </div>
      <div class="input-area">
        <div class="input-btns">
          <button class="input-btn" id="voice-btn" title="Голосовое" onclick="toggleVoice()">🎤</button>
          <button class="input-btn" title="Фото" onclick="document.getElementById('photo-inp').click()">📷</button>
          <input type="file" id="photo-inp" accept="image/*" style="display:none" onchange="sendPhoto(this)"/>
        </div>
        <textarea id="msg-input" rows="1" placeholder="Сообщение..."></textarea>
        <button class="btn-send" onclick="sendMsg()">
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>

    <div id="online-panel">
      <div class="online-title">👥 <span id="online-count">0</span></div>
      <div class="online-list" id="online-list"></div>
    </div>
  </div>
</div>

<!-- BG MODAL -->
<div class="modal-overlay" id="bg-modal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <h3>🎨 Фон чата</h3>
    <button class="bg-upload-btn" onclick="document.getElementById('bg-file-inp').click()">📁 Загрузить своё фото</button>
    <input type="file" id="bg-file-inp" accept="image/*" style="display:none" onchange="setCustomBg(this)"/>
    <div class="bg-grid" id="bg-grid"></div>
    <button class="modal-close" onclick="document.getElementById('bg-modal').style.display='none'">Закрыть</button>
  </div>
</div>

<!-- AVATAR EDITOR MODAL -->
<div class="modal-overlay" id="av-modal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <h3>👤 Моя аватарка</h3>
    <div class="av-editor">
      <div class="av-big" id="av-big-preview" onclick="document.getElementById('av-edit-inp').click()">
        <span id="av-big-text">?</span>
      </div>
      <input type="file" id="av-edit-inp" accept="image/*" style="display:none" onchange="applyAvatarPhoto(this)"/>
      <div class="av-hint">Нажми на круг чтобы выбрать фото<br>или выбери цвет аватарки</div>
      <div class="av-colors" id="av-colors"></div>
      <button class="btn-primary" style="width:100%;margin-top:4px" onclick="saveAvatar()">Сохранить</button>
      <button class="modal-close" onclick="document.getElementById('av-modal').style.display='none'">Отмена</button>
    </div>
  </div>
</div>

<!-- IMAGE VIEWER -->
<div class="img-viewer" id="img-viewer" style="display:none" onclick="this.style.display='none'">
  <img id="img-view-src" src="" alt=""/>
</div>

<!-- CONTEXT MENU -->
<div class="ctx-menu" id="ctx-menu" style="display:none">
  <div class="ctx-item" onclick="ctxReply()">↩️ Ответить</div>
  <div class="ctx-item" onclick="ctxReact()">😀 Реакция</div>
  <div class="ctx-item danger" onclick="ctxDelete()">🗑 Удалить</div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

  else{m.style.background=style;}
}

window.doAuth=async function(){
  const name=document.getElementById('inp-name').value.trim();
  const pass=document.getElementById('inp-pass').value;
  const room=document.getElementById('inp-room').value.trim();
  const errEl=document.getElementById('auth-err');
  errEl.textContent='';
  if(!name){errEl.textContent='Введи имя';return;}
  if(pass.length<3){errEl.textContent='Пароль минимум 3 символа';return;}
  if(!room){errEl.textContent='Введи название комнаты';return;}
  const safeRoom=room.toLowerCase().replace(/[^a-zа-яё0-9]/gi,'_');
  const userRef=ref(db,`users/${name}`);
  try{
    const snap=await get(userRef);
    if(authMode==='register'){
      if(snap.exists()){errEl.textContent='Имя уже занято';return;}
      await set(userRef,{pass,avatar:authAvatarData||null,avColor:nameColor(name),created:Date.now()});
      myAvatar=authAvatarData;
      toast('Аккаунт создан!');
    } else {
      if(!snap.exists()){errEl.textContent='Пользователь не найден';return;}
      if(snap.val().pass!==pass){errEl.textContent='Неверный пароль';return;}
      myAvatar=snap.val().avatar||null;
    }
    const savedAv=JSON.parse(localStorage.getItem('myAvatar')||'null');
    if(savedAv&&savedAv.img) myAvatar=savedAv.img;
    startChat(name,safeRoom,room);
  }catch(e){errEl.textContent='Ошибка. Проверь Firebase Rules.';}
};

function startChat(name,safeRoom,dispRoom){
  myName=name;roomId=safeRoom;
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('chat-screen').style.display='flex';
  document.getElementById('hdr-room').textContent='# '+dispRoom;
  updateMyHeaderAv();
  loadBg();

  onValue(ref(db,`rooms/${roomId}/messages`),snap=>{allMessages=snap.val()||{};renderMessages(allMessages);});
  onValue(ref(db,`rooms/${roomId}/typing`),snap=>{
    const d=snap.val()||{};
    const o=Object.entries(d).filter(([k,v])=>k!==myName&&v).map(([k])=>k);
    document.getElementById('typing-ind').textContent=o.length?o.join(', ')+' печатает...':'';
  });
  typingRef=ref(db,`rooms/${roomId}/typing/${myName}`);
  onDisconnect(typingRef).remove();
  const onRef=ref(db,`rooms/${roomId}/online/${myName}`);
  set(onRef,{name:myName,avatar:myAvatar||null,avColor:nameColor(myName),ts:Date.now()});
  onDisconnect(onRef).remove();
  onValue(ref(db,`rooms/${roomId}/online`),snap=>renderOnline(snap.val()||{}));
}

// voice
window.toggleVoice=async function(){
  const btn=document.getElementById('voice-btn');
  if(!isRecording){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      // iOS Safari supports audio/mp4, desktop supports audio/webm
      let mimeType='';
      if(MediaRecorder.isTypeSupported('audio/mp4')) mimeType='audio/mp4';
      else if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mimeType='audio/webm;codecs=opus';
      else if(MediaRecorder.isTypeSupported('audio/webm')) mimeType='audio/webm';
      recChunks=[];recStart=Date.now();
      try{mediaRec=mimeType?new MediaRecorder(stream,{mimeType}):new MediaRecorder(stream);}
      catch(e){mediaRec=new MediaRecorder(stream);}
      mediaRec.ondataavailable=e=>{if(e.data&&e.data.size>0)recChunks.push(e.data);};
      mediaRec.onstop=()=>{
        const mime=mediaRec.mimeType||mimeType||'audio/mp4';
        const blob=new Blob(recChunks,{type:mime});
        const dur=Math.max(1,Math.round((Date.now()-recStart)/1000));
        const r2=new FileReader();r2.onload=ev=>{
          const msg={type:'voice',name:myName,data:ev.target.result,dur,ts:serverTimestamp()};
          if(replyTo)msg.replyTo=replyTo;
          push(ref(db,`rooms/${roomId}/messages`),msg);
          cancelReply();toast('Голосовое отправлено ✓');
        };r2.readAsDataURL(blob);
        stream.getTracks().forEach(t=>t.stop());
      };
      mediaRec.start(100); // collect data every 100ms for iOS
      isRecording=true;btn.classList.add('recording');btn.title='Нажми чтобы остановить';
      btn.textContent='⏹';
    }catch(e){
      if(e.name==='NotAllowedError') toast('Разреши доступ к микрофону в настройках');
      else toast('Микрофон недоступен: '+e.message);
    }
  } else {
    mediaRec.stop();isRecording=false;btn.classList.remove('recording');
    btn.title='Голосовое';btn.textContent='🎤';
  }
};

let pickerMsgId=null;
function showReactionPicker(msgId){
  // remove existing pickers
  document.querySelectorAll('.reaction-picker').forEach(p=>p.remove());

  const row=document.querySelector(`.msg-row[data-id="${msgId}"]`);
  if(!row)return;
  const picker=document.createElement('div');picker.className='reaction-picker';
  EMOJIS.forEach(em=>{
    const btn=document.createElement('button');btn.textContent=em;
    btn.onclick=(e)=>{e.stopPropagation();toggleReaction(msgId,em);picker.remove();};
    picker.appendChild(btn);
  });

// render
function renderMessages(msgs){
  const c=document.getElementById('messages');
  const atBot=c.scrollHeight-c.scrollTop-c.clientHeight<80;
  c.innerHTML='';lastDate='';
  if(!msgs||Object.keys(msgs).length===0){
    c.innerHTML='<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:.88rem;text-align:center;padding:40px;gap:10px"><span style="font-size:2.5rem">👋</span>Пока нет сообщений</div>';
    return;
  }
  Object.entries(msgs).forEach(([id,msg])=>{
    const ds=fmtDate(msg.ts);
    if(ds&&ds!==lastDate){const d=document.createElement('div');d.className='date-div';d.textContent=ds;c.appendChild(d);lastDate=ds;}
    const isMe=msg.name===myName;
    const row=document.createElement('div');
    row.className=`msg-row ${isMe?'me':'them'}`;
    row.dataset.id=id;
    // long press / right click
    let pressTimer;
    row.addEventListener('contextmenu',e=>showCtxMenu(e,id,msg));
    row.addEventListener('touchstart',e=>{pressTimer=setTimeout(()=>showCtxMenu(e.touches[0],id,msg),500);},{passive:true});
    row.addEventListener('touchend',()=>clearTimeout(pressTimer));
    row.addEventListener('touchmove',()=>clearTimeout(pressTimer));

    // avatar
    if(!isMe){
      const av=document.createElement('div');av.className='msg-av';
      setAvContent(av,msg.name,null,28);
      row.appendChild(av);
    }

    const wrap=document.createElement('div');wrap.className='msg-wrap';
    const bub=document.createElement('div');bub.className='msg-bubble';

    // sender name for others
    if(!isMe){const nm=document.createElement('div');nm.className='msg-name';nm.textContent=msg.name;bub.appendChild(nm);}

    // reply preview
    if(msg.replyTo){
      const rp=document.createElement('div');rp.className='reply-preview';
      const rn=document.createElement('div');rn.className='reply-preview-name';rn.textContent=msg.replyTo.name;
      const rt=document.createElement('div');rt.className='reply-preview-text';rt.textContent=msg.replyTo.text;
      rp.appendChild(rn);rp.appendChild(rt);
      rp.onclick=()=>scrollToMsg(msg.replyTo.id);
      bub.appendChild(rp);
    }

    // content
    if(msg.type==='text'||!msg.type){
      const t=document.createElement('div');t.textContent=msg.text;bub.appendChild(t);
    } else if(msg.type==='photo'){
      const img=document.createElement('img');img.className='msg-photo';img.src=msg.data;img.onclick=()=>viewPhoto(msg.data);bub.appendChild(img);
    } else if(msg.type==='voice'){
      const vw=document.createElement('div');vw.className='voice-msg';
      const pb=document.createElement('button');pb.className='voice-play';pb.textContent='▶';pb.onclick=()=>playVoice(pb,msg.data);
      const wv=document.createElement('div');wv.className='voice-wave';for(let i=0;i<7;i++){const s=document.createElement('span');wv.appendChild(s);}
      const dr=document.createElement('span');dr.className='voice-dur';dr.textContent=(msg.dur||0)+'с';
      vw.appendChild(pb);vw.appendChild(wv);vw.appendChild(dr);bub.appendChild(vw);
    }

    // time + react btn
    const btmRow=document.createElement('div');btmRow.style.cssText='display:flex;align-items:center;gap:6px;margin-top:3px';
    const tm=document.createElement('div');tm.className='msg-time';tm.style.flex='1';tm.textContent=fmtTime(msg.ts);
    const rb=document.createElement('button');rb.style.cssText='background:none;border:none;color:rgba(255,255,255,.35);font-size:.8rem;cursor:pointer;padding:0 2px;line-height:1';rb.textContent='😀';
    rb.onclick=(e)=>{e.stopPropagation();showReactionPicker(id);};
    btmRow.appendChild(tm);btmRow.appendChild(rb);
    bub.appendChild(btmRow);
    wrap.appendChild(bub);

    // action buttons: reply + delete (shown on hover/tap)
    const actions=document.createElement('div');
    actions.className='msg-actions';
    actions.style.cssText=`display:flex;flex-direction:column;gap:4px;align-self:center;opacity:0;transition:opacity .15s;${isMe?'margin-right:6px':'margin-left:6px'}`;

    const replyBtn=document.createElement('button');
    replyBtn.className='msg-action-btn';
    replyBtn.title='Ответить';replyBtn.textContent='↩';
    replyBtn.onclick=(e)=>{e.stopPropagation();startReply(id,msg);};

    actions.appendChild(replyBtn);

    if(isMe){
      const delBtn=document.createElement('button');
      delBtn.className='msg-action-btn del';
      delBtn.title='Удалить';delBtn.textContent='🗑';
      delBtn.onclick=(e)=>{e.stopPropagation();if(confirm('Удалить сообщение?'))remove(ref(db,`rooms/${roomId}/messages/${id}`));};
      actions.appendChild(delBtn);
    }

    // show/hide on hover and tap
    row.addEventListener('mouseenter',()=>actions.style.opacity='1');
    row.addEventListener('mouseleave',()=>actions.style.opacity='0');
    let tapShown=false;
    row.addEventListener('touchstart',()=>{
      if(!tapShown){actions.style.opacity='1';tapShown=true;setTimeout(()=>{actions.style.opacity='0';tapShown=false;},3000);}
    },{passive:true});

    if(isMe) row.insertBefore(actions, wrap);
    else row.appendChild(actions);

    // reactions
    if(msg.reactions){
      const rRow=document.createElement('div');rRow.className='msg-reactions';
      Object.entries(msg.reactions).forEach(([em,users])=>{
        const count=Object.keys(users).length;if(!count)return;
        const mine=users[myName];
        const chip=document.createElement('div');chip.className='reaction-chip'+(mine?' mine':'');
        chip.innerHTML=`${em} <span class="r-count">${count}</span>`;
        chip.onclick=(e)=>{e.stopPropagation();toggleReaction(id,em);};
        rRow.appendChild(chip);
      });
      wrap.appendChild(rRow);
    }

    row.appendChild(wrap);
    c.appendChild(row);
  });
  if(atBot)c.scrollTop=c.scrollHeight;
}

// utils
function nameColor(n){const c=['#6c8cff','#a78bfa','#34d399','#f472b6','#fb923c','#60a5fa'];let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))&0xffffffff;return c[Math.abs(h)%c.length];}
function initials(n){return n?n.trim().slice(0,2).toUpperCase():'';}
function fmtTime(ts){if(!ts)return'';return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(ts){if(!ts)return'';const d=new Date(ts),t=new Date();if(d.toDateString()===t.toDateString())return'Сегодня';const y=new Date(t);y.setDate(t.getDate()-1);if(d.toDateString()===y.toDateString())return'Вчера';return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}

// textarea
const inp=document.getElementById('msg-input');
inp.addEventListener('input',()=>{
  inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';
  if(typingRef){set(typingRef,true);clearTimeout(typingTO);typingTO=setTimeout(()=>set(typingRef,false),2500);}
});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();window.sendMsg();}});

// expose
window.nameColor=nameColor;window.initials=initials;window.playVoice=playVoice;window.viewPhoto=viewPhoto;window.cancelReply=cancelReply;window.toast=toast;
</script>
</body>
