<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Чат</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --panel:    #21253a;
      --border:   #2e334d;
      --accent:   #6c8cff;
      --accent2:  #a78bfa;
      --text:     #e8eaf6;
      --muted:    #7b82a8;
      --me-bg:    linear-gradient(135deg, #6c8cff, #a78bfa);
      --them-bg:  #2a2f47;
      --radius:   18px;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Login screen ── */
    #login-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 24px;
      background: radial-gradient(ellipse 80% 60% at 50% 40%, #1a1f3a 0%, var(--bg) 70%);
    }

    .login-logo {
      width: 72px; height: 72px;
      background: var(--me-bg);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      box-shadow: 0 8px 32px rgba(108,140,255,0.35);
    }

    .login-title {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .login-sub {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
    }

    .login-form {
      display: flex; flex-direction: column; gap: 12px;
      width: 100%; max-width: 340px;
    }

    .login-form input {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    .login-form input::placeholder { color: var(--muted); }
    .login-form input:focus { border-color: var(--accent); }

    .btn-enter {
      background: var(--me-bg);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin-top: 4px;
    }
    .btn-enter:hover  { opacity: 0.9; transform: translateY(-1px); }
    .btn-enter:active { transform: translateY(0); }

    /* ── Chat screen ── */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100dvh;
    }

    /* Header */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--me-bg);
      display: flex; align-items: center; justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .chat-header-info { flex: 1; min-width: 0; }
    .chat-header-name {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-header-status {
      font-size: 0.72rem;
      color: #4ade80;
      display: flex; align-items: center; gap: 4px;
    }
    .dot-online {
      width: 6px; height: 6px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .btn-leave {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-leave:hover { color: #f87171; border-color: #f87171; }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Date divider */
    .date-divider {
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      margin: 8px 0 4px;
      letter-spacing: 0.05em;
    }

    /* Message row */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: msgIn 0.25s ease both;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.me  { flex-direction: row-reverse; }
    .msg-row.me .avatar { display: none; }

    .msg-bubble {
      max-width: min(72%, 360px);
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      line-height: 1.45;
      word-break: break-word;
      position: relative;
    }

    .msg-row.me .msg-bubble {
      background: var(--me-bg);
      color: #fff;
      border-bottom-right-radius: 5px;
    }
    .msg-row.them .msg-bubble {
      background: var(--them-bg);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }
    .msg-name {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent2);
    }
    .msg-time {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.45);
      margin-top: 2px;
      text-align: right;
    }
    .msg-row.them .msg-time { color: var(--muted); text-align: left; }

    /* Typing indicator */
    #typing-indicator {
      padding: 0 16px 8px;
      font-size: 0.75rem;
      color: var(--muted);
      min-height: 22px;
      flex-shrink: 0;
    }

    /* Input area */
    .input-area {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 12px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #msg-input {
      flex: 1;
      background: var(--panel);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 11px 14px;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }
    #msg-input::placeholder { color: var(--muted); }
    #msg-input:focus { border-color: var(--accent); }

    .btn-send {
      width: 44px; height: 44px;
      background: var(--me-bg);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.2s;
    }
    .btn-send:hover  { transform: scale(1.08); }
    .btn-send:active { transform: scale(0.96); }
    .btn-send svg { width: 20px; height: 20px; fill: #fff; }

    /* Empty state */
    .empty-chat {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: var(--muted); font-size: 0.85rem; text-align: center;
      padding: 32px;
    }
    .empty-chat span { font-size: 2.5rem; }

    /* Error toast */
    #error-toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #f87171; color: #fff;
      padding: 10px 20px; border-radius: 20px;
      font-size: 0.82rem; font-family: 'Inter', sans-serif;
      opacity: 0; transition: opacity 0.3s;
      pointer-events: none; z-index: 100;
    }
    #error-toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">💬</div>
  <div>
    <div class="login-title">Войти в чат</div>
    <p class="login-sub" style="margin-top:8px">Введи имя и название комнаты — и позови друга присоединиться</p>
  </div>
  <div class="login-form">
    <input id="inp-name" type="text" placeholder="Твоё имя" maxlength="24" autocomplete="off"/>
    <input id="inp-room" type="text" placeholder="Название комнаты (любое)" maxlength="32" autocomplete="off"/>
    <button class="btn-enter" onclick="enterChat()">Войти →</button>
  </div>
</div>

<!-- CHAT -->
<div id="chat-screen">
  <div class="chat-header">
    <div class="avatar" id="hdr-avatar">?</div>
    <div class="chat-header-info">
      <div class="chat-header-name" id="hdr-room">Комната</div>
      <div class="chat-header-status"><div class="dot-online"></div>онлайн</div>
    </div>
    <button class="btn-leave" onclick="leaveChat()">Выйти</button>
  </div>

  <div id="messages">
    <div class="empty-chat" id="empty-state">
      <span>👋</span>
      Пока нет сообщений.<br>Напиши первым!
    </div>
  </div>

  <div id="typing-indicator"></div>

  <div class="input-area">
    <textarea id="msg-input" rows="1" placeholder="Сообщение..." maxlength="1000"></textarea>
    <button class="btn-send" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<div id="error-toast"></div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, serverTimestamp, set, onDisconnect, remove }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAOJruioW78739DlsOU9jT-ryiHNjWmSYE",
    authDomain: "chat-8d585.firebaseapp.com",
    databaseURL: "https://chat-8d585-default-rtdb.firebaseio.com",
    projectId: "chat-8d585",
    storageBucket: "chat-8d585.firebasestorage.app",
    messagingSenderId: "32516069802",
    appId: "1:32516069802:web:d113054256d6370da933d3",
    measurementId: "G-M37GLZH8F4"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  let myName = '';
  let roomId = '';
  let typingRef = null;
  let typingTimeout = null;
  let lastDate = '';

  // Color for avatar based on name
  function nameColor(name) {
    const colors = ['#6c8cff','#a78bfa','#34d399','#f472b6','#fb923c','#60a5fa'];
    let h = 0;
    for (let c of name) h = (h * 31 + c.charCodeAt(0)) & 0xffffffff;
    return colors[Math.abs(h) % colors.length];
  }

  function initials(name) {
    return name.trim().slice(0,2).toUpperCase();
  }

  window.enterChat = function() {
    const name = document.getElementById('inp-name').value.trim();
    const room = document.getElementById('inp-room').value.trim();
    if (!name) { showError('Введи своё имя'); return; }
    if (!room) { showError('Введи название комнаты'); return; }

    myName = name;
    roomId = room.toLowerCase().replace(/[^a-zа-яё0-9]/gi, '_');

    // UI
    document.getElementById('login-screen').style.display = 'none';
    const cs = document.getElementById('chat-screen');
    cs.style.display = 'flex';
    document.getElementById('hdr-room').textContent = '# ' + room;
    const av = document.getElementById('hdr-avatar');
    av.textContent = initials(name);
    av.style.background = nameColor(name);

    // Listen messages
    const msgsRef = ref(db, `rooms/${roomId}/messages`);
    onValue(msgsRef, snap => {
      const msgs = snap.val();
      renderMessages(msgs);
    });

    // Listen typing
    const typingRoomRef = ref(db, `rooms/${roomId}/typing`);
    onValue(typingRoomRef, snap => {
      const data = snap.val() || {};
      const others = Object.entries(data)
        .filter(([k, v]) => k !== myName && v)
        .map(([k]) => k);
      const ti = document.getElementById('typing-indicator');
      ti.textContent = others.length ? `${others.join(', ')} печатает...` : '';
    });

    // Set up typing ref
    typingRef = ref(db, `rooms/${roomId}/typing/${myName}`);
    onDisconnect(typingRef).remove();
  };

  window.leaveChat = function() {
    if (typingRef) remove(typingRef);
    document.getElementById('chat-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('messages').innerHTML =
      '<div class="empty-chat" id="empty-state"><span>👋</span>Пока нет сообщений.<br>Напиши первым!</div>';
    lastDate = '';
  };

  window.sendMessage = function() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;

    push(ref(db, `rooms/${roomId}/messages`), {
      name: myName,
      text,
      ts: serverTimestamp()
    });

    input.value = '';
    input.style.height = 'auto';
    if (typingRef) set(typingRef, false);
    clearTimeout(typingTimeout);
  };

  // Typing detection
  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('msg-input');
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';

      if (typingRef) {
        set(typingRef, true);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => set(typingRef, false), 2500);
      }
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        window.sendMessage();
      }
    });
  });

  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  function formatDate(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const today = new Date();
    if (d.toDateString() === today.toDateString()) return 'Сегодня';
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) return 'Вчера';
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  }

  function renderMessages(msgs) {
    const container = document.getElementById('messages');
    const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;

    container.innerHTML = '';
    lastDate = '';

    if (!msgs) {
      container.innerHTML = '<div class="empty-chat" id="empty-state"><span>👋</span>Пока нет сообщений.<br>Напиши первым!</div>';
      return;
    }

    Object.values(msgs).forEach(msg => {
      const dateStr = formatDate(msg.ts);
      if (dateStr && dateStr !== lastDate) {
        const div = document.createElement('div');
        div.className = 'date-divider';
        div.textContent = dateStr;
        container.appendChild(div);
        lastDate = dateStr;
      }

      const isMe = msg.name === myName;
      const row = document.createElement('div');
      row.className = `msg-row ${isMe ? 'me' : 'them'}`;

      if (!isMe) {
        const av = document.createElement('div');
        av.className = 'avatar';
        av.textContent = initials(msg.name);
        av.style.cssText = `width:28px;height:28px;font-size:0.72rem;background:${nameColor(msg.name)}`;
        row.appendChild(av);
      }

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      if (!isMe) {
        const nameEl = document.createElement('div');
        nameEl.className = 'msg-name';
        nameEl.textContent = msg.name;
        meta.appendChild(nameEl);
      }

      const textEl = document.createElement('div');
      textEl.textContent = msg.text;

      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.textContent = formatTime(msg.ts);

      if (!isMe) bubble.appendChild(meta);
      bubble.appendChild(textEl);
      bubble.appendChild(timeEl);
      row.appendChild(bubble);
      container.appendChild(row);
    });

    if (wasAtBottom || container.children.length <= 2) {
      container.scrollTop = container.scrollHeight;
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 2500);
  }

  window.showError = showError;
</script>
</body>
</html>
